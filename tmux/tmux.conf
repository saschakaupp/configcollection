# Status bar
set -g status-justify left
set -g status-style 'bg=#24273a,fg=#a5adcb,dim'
set -g status-interval 2
set -g status-position bottom
set -g status-left ''
set -g status-right '#[fg=#cad3f5,bg=#363a4f,bold] #{pane_current_path} #[fg=#24273a,bg=#b7bdf8,bold] %Y-%m-%dT%H:%M:%S%z '
set -g status-right-length 120
set -g status-left-length 20

# IDE workflow
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
setw -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on

# Keep new windows and panes in the current working directory
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Window list
setw -g window-status-format ' #I:#W#F '
setw -g window-status-style 'fg=#a5adcb,bg=#363a4f'
setw -g window-status-current-format ' #I:#W#F '
setw -g window-status-current-style 'fg=#24273a,bg=#8aadf4,bold'
setw -g window-status-bell-style 'fg=#24273a,bg=#eed49f,bold'

# Messages and copy mode
set -g message-style 'fg=#cad3f5,bg=#363a4f,bold'
set -g message-command-style 'fg=#8aadf4,bg=#494d64'
setw -g mode-style 'fg=#24273a,bg=#939ab7,bold'
setw -g clock-mode-colour '#c6a0f6'

# Pane borders
set -g pane-border-style 'fg=#6e738d,bg=#24273a'
set -g pane-active-border-style 'fg=#b7bdf8,bg=#24273a'

# Alerts
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

set -g default-terminal 'screen-256color'

# Custom key binds
bind r source-file ~/.tmux.conf \; display-message "Reloaded config"
